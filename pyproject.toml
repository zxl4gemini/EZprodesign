[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezprodesign"
version = "0.1.0"
description = "Interpretable exploratory protein surface accessibility toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "biopython>=1.80,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["structural-biology", "epitope", "membrane-protein", "protein-structure", "accessibility"]
[project.optional-dependencies]
web = ["Flask>=2.2,<4"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/zxl4gemini/EZprodesign"
Issues = "https://github.com/zxl4gemini/EZprodesign/issues"

[tool.setuptools]
packages = ["v15_engine", "v15_web"]
[tool.setuptools.package-data]
v15_web = ["static/*", "templates/*", "vendor/*", "examples/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
